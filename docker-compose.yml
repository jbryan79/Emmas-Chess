version: '3.8'

services:
  chess:
    build: .
    container_name: emmas-chess
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    # Resource limits (optional - your PC can handle it!)
    deploy:
      resources:
        limits:
          memory: 512M
